default_language_version.python = "python3"
default_stages = ["pre-commit", "pre-push"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "check-added-large-files", args = [
        "--maxkb=1024",
    ] },
    { id = "check-case-conflict" },
    { id = "check-merge-conflict" },
    { id = "check-symlinks" },
    { id = "check-toml" },
    { id = "destroyed-symlinks" },
    { id = "end-of-file-fixer", exclude = "\\.out$" },
    { id = "no-commit-to-branch", args = [
        "--pattern",
        "[^a-zA-Z0-9_/-]",
    ] },
    { id = "trailing-whitespace", exclude = "\\.out$" },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"
hooks = [{ id = "forbid-submodules" }]

[[repos]]
# Keep in sync with the ruff pin in pyproject.toml; update-ruff.yml bumps both
# and check-tool-pins enforces it.
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.9"
hooks = [
    { id = "ruff-check", exclude = "\\.out$|^benches/" },
    { id = "ruff-format", args = [
        "--check",
    ], exclude = "\\.out$|^benches/" },
]

[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.8.14"
hooks = [{ id = "uv-lock" }]


[[repos]]
# Keep in sync with the ty pin in pyproject.toml; check-tool-pins enforces it.
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.82"
hooks = [{ id = "ty" }]

[[repos]]
repo = "local"
hooks = [
    { id = "check-tool-pins", name = "ruff and ty pins agree", language = "python", entry = "python .github/scripts/check_tool_pins.py", files = "^(pyproject|prek)\\.toml$", pass_filenames = false },
]
