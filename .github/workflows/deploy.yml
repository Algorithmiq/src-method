name: Publish src_method Python sdist and wheels

on:
  release:
    types:
      - published
  pull_request:
    # PRs trigger for the "opened", "reopened", "synchronize" events (default) and
    # "ready_for_review"
    paths:
      - .github/workflows/deploy.yml
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COLUMNS: 120
  FORCE_COLOR: 3

jobs:
  build-sdist-wheel:
    name: Build source distribution and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # such that setuptools_scm can do its job correctly

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build SDist and Wheel
        run: |
          # the `build` package's console script is `pyproject-build`, not `build`
          uvx --from build pyproject-build --verbose --sdist --wheel --installer=uv

      - uses: actions/upload-artifact@v7
        with:
          name: cibw-dist
          path: |
            dist/*.tar.gz
            dist/*.whl


  upload_pypi:
    name: Upload to PyPI
    needs:
      - build-sdist-wheel
    if: github.event_name == 'release' && github.event.action == 'published'

    runs-on: ubuntu-latest

    # Requires a `pypi` environment (Settings > Environments) with a Trusted
    # Publisher configured on https://pypi.org for this repo and workflow, and
    # ideally required reviewers, since a release here cannot be undone.
    environment:
      name: pypi
      url: https://pypi.org/project/src_method/

    permissions:
      id-token: write  # for PyPI's trusted publishing (OIDC); no token is stored

    steps:
      - uses: actions/download-artifact@v8
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
