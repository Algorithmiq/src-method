name: Bug report
description: Report a bug or unexpected behavior in src-method
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.
        See also the "Reporting bugs" section of CONTRIBUTING.md.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        A minimal, self-contained reproducer, ideally with a fixed `seed=`.
        For accuracy problems include the number of sites, the bond dimensions,
        `chi_out`, the `dtype` and the error metric you used.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - CPU (NumPy)
        - GPU, NVIDIA (CuPy, CUDA)
        - GPU, AMD (CuPy, ROCm)
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Versions of `src_method`, Python, NumPy and, for GPU runs, CuPy and the CUDA/ROCm runtime.
      render: text
      placeholder: |
        src_method: (python -c "import src_method; print(src_method.__version__)")
        Python:
        NumPy:
        CuPy:
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (x86_64)
        - Linux (aarch64 / ARM64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Logs, tracebacks, or any other relevant information.
